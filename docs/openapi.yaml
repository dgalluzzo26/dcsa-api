            application/json:
              schema:
                $ref: '#/components/schemas/AmbiguousSubjectResponse'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
    get:
      tags:
      - fpvr-requests
      summary: List official FPVR-1 Application Bundle requests
      description: 'Return FPVR-1 request log rows matching optional filters.


        Filters AND together. Nested ``report`` is not assembled; GET by id for a ready payload.'
      operationId: list_fpvr1_requests_api_v1_requests_fpvr_1_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RequestStatusValue'
          - type: 'null'
          title: Status
      - name: requested_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested By
      - name: requested_at_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound on requested_at (ISO-8601). Alone this is after;
            with requested_at_before this is between.
          title: Requested At After
        description: Inclusive lower bound on requested_at (ISO-8601). Alone this is after;
