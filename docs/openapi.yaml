components:
  schemas:
    ActivitySectionRow:
      properties:
        ACTIVITY_ID:
          anyOf:
          - type: string
          - type: 'null'
          title: Activity Id
        LOCATION_CODE:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Code
        ACTIVITY_TYPE:
          anyOf:
          - type: string
          - type: 'null'
          title: Activity Type
        DETAIL:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        EVENT_TS:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Ts
        LOAD_SEQ:
          anyOf:
          - type: string
          - type: 'null'
          title: Load Seq
      additionalProperties: false
      type: object
      title: ActivitySectionRow
      description: Public activity section row (SSN omitted).
    AmbiguousSubjectResponse:
      properties:
        detail:
          type: string
          title: Detail
          default: Multiple subjects matched; provide more information or candidate_id
        candidates:
          items:
            $ref: '#/components/schemas/SubjectCandidate'
          type: array
          title: Candidates
        total:
          type: integer
          title: Total
      type: object
      required:
      - candidates
      - total
      title: AmbiguousSubjectResponse
      description: "Returned when identity filters match more than one person.\n\nAttributes:\n\
        \    detail: Human-readable explanation.\n    candidates: Matches without SSN.\n \
        \   total: Number of candidates returned."
    ApiCatalog:
      properties:
        title:
          type: string
          title: Title
        version:
          type: string
          title: Version
        apis:
          items:
            $ref: '#/components/schemas/CatalogApi'
          type: array
          title: Apis
        reports:
          items:
            $ref: '#/components/schemas/CatalogReport'
          type: array
          title: Reports
        notes:
          items:
            type: string
          type: array
          title: Notes
      type: object
      required:
      - title
      - version
      - apis
      - reports
      - notes
      title: ApiCatalog
      description: Machine-readable help for callers of the FPVR APIs.
    CatalogApi:
      properties:
        id:
          type: string
          title: Id
        method:
          type: string
          title: Method
        path:
          type: string
          title: Path
        auth:
          type: string
          title: Auth
        summary:
          type: string
          title: Summary
        request_body:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Request Body
        scenarios:
          items:
            $ref: '#/components/schemas/CatalogScenario'
          type: array
          title: Scenarios
      type: object
      required:
      - id
      - method
      - path
      - auth
      - summary
      - scenarios
      title: CatalogApi
      description: One FPVR HTTP API (token, create, list, or get by id).
    CatalogField:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        nullable:
          type: boolean
          title: Nullable
          default: true
      type: object
      required:
      - name
      - type
      title: CatalogField
      description: One JSON field in a report section row.
    CatalogReport:
      properties:
        report_code:
          type: string
          title: Report Code
        title:
          type: string
          title: Title
        sources:
          items:
            type: string
          type: array
          title: Sources
        tables:
          items:
            type: string
          type: array
          title: Tables
        readiness:
          type: string
          title: Readiness
        data_fields:
          additionalProperties:
            items:
              $ref: '#/components/schemas/CatalogField'
            type: array
          type: object
          title: Data Fields
        example_response:
          additionalProperties: true
          type: object
          title: Example Response
      type: object
      required:
      - report_code
      - title
      - sources
      - tables
      - readiness
      - data_fields
      - example_response
      title: CatalogReport
      description: Per-report payload contract nested in request.report.
    CatalogScenario:
      properties:
        id:
          type: string
          title: Id
        http_status:
          type: integer
          title: Http Status
        summary:
          type: string
          title: Summary
        request:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Request
        response:
          additionalProperties: true
          type: object
          title: Response
      type: object
      required:
      - id
      - http_status
      - summary
      - response
      title: CatalogScenario
      description: One HTTP outcome for an API.
    CheckSectionRow:
      properties:
        CHECK_ID:
          anyOf:
          - type: string
          - type: 'null'
          title: Check Id
        LOCATION_CODE:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Code
        CHECK_TYPE:
          anyOf:
          - type: string
          - type: 'null'
          title: Check Type
        RESULT_CODE:
          anyOf:
