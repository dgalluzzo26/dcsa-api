openapi: 3.1.0
info:
  title: DCSA API
  description: 'Backend FastAPI service for DCSA on Databricks Apps.


    ## Docs

    - FPVR catalog (schemas + scenarios): [`/api/v1/catalog`](/api/v1/catalog)

    - Human-readable help: [`/help`](/help)

    - Interactive Swagger UI: [`/docs`](/docs)

    - ReDoc: [`/redoc`](/redoc)

    - OpenAPI JSON: [`/openapi.json`](/openapi.json)


    Layering: **routes** (HTTP) → **services** (business logic) → **models** (schemas).'
  contact:
    name: DCSA API
  version: 0.5.2
paths:
  /api/v1/subject-identities:
    get:
      tags:
      - subject-identity
      summary: Search subject identities (OBO SQL)
      description: 'Search subject identities using query-string filters.


        At least one of `ssn`, `first_name`, `last_name` or `date_of_birth` is required.'
      operationId: list_subject_identities_api_v1_subject_identities_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ssn
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Social Security Number
          title: Ssn
        description: Social Security Number
      - name: first_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
      - name: last_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      - name: date_of_birth
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: YYYY-MM-DD
          title: Date Of Birth
        description: YYYY-MM-DD
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectIdentityListResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/subject-identities/search:
    post:
      tags:
      - subject-identity
      summary: Search subject identities (OBO SQL, JSON body)
      description: 'Search subject identities using a JSON body.


        Prefer this over the GET endpoint so SSNs are not written to URLs and access logs.'
      operationId: search_subject_identities_api_v1_subject_identities_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectIdentitySearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectIdentityListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/requests/fpvr-1:
    post:
      tags:
      - fpvr-requests
      summary: Open an official FPVR-1 Application Bundle request
      description: 'Create an FPVR-1 request. Report code is implied by the path.


