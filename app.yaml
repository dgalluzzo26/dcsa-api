# Databricks Apps runtime — FastAPI backend only.
# OpenAPI UI: /docs  ·  ReDoc: /redoc  ·  OpenAPI JSON: /openapi.json
command:
  - uvicorn
  - app.main:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"

env:
  - name: DCSA_APP_NAME
    value: "dcsa-api"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DCSA_SUBJECT_IDENTITY_TABLE
    value: "dcsa_catalog.edladmin.subject_identity"
  - name: DCSA_REQUEST_LOG_TABLE
    value: "dcsa_catalog.dcsa_api.api_request_log"
  - name: DCSA_CATALOG_SCHEMA
    value: "dcsa_catalog.edladmin"
  - name: DCSA_TABLE_IDENTITY
    value: "subject_identity"
  - name: DCSA_TABLE_STATUS
    value: "subject_status"
  - name: DCSA_TABLE_CHECK
    value: "subject_check"
  - name: DCSA_TABLE_ACTIVITY
    value: "subject_activity"
  - name: DCSA_TABLE_SIGNAL
    value: "subject_signal"
